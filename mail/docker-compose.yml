# حوات ميل على https://hawat.id/mail/ (nginx يوصّل له). الحسابات وكلمات مرور التطبيقات في data/mail على السيرفر فقط.
services:
  hawatmail:
    build: .
    container_name: hawatmail
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${MAIL_HOST_PORT:-18495}:8095"
    volumes:
      - ../data/mail:/data
    mem_limit: 512m
