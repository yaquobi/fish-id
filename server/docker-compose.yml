services:
  fishid:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: fishid
    restart: unless-stopped
    env_file: .env
    # يسمع على السيرفر نفسه بس (المنفذ يتغير بـ FISHID_HOST_PORT)، و nginx يوصّل له من https://hawat.id/api/
    ports:
      - "127.0.0.1:${FISHID_HOST_PORT:-18490}:8080"
    # صور يساهم فيها المستخدمون بموافقتهم (fishId/contribute)، تنحفظ على السيرفر في /opt/fish-id/data/contrib.
    volumes:
      - ../data/contrib:/app/contrib
      # الحسابات وسجل الفحوصات وإعدادات الباقات (لوحة الأدمن على https://hawat.id/api/admin).
      - ../data/accounts:/app/accounts
      # أرشيف كتاب أسماك البحر الأحمر (صور وأسماء محلية)، للقراءة بس.
      - ../data/book/archive:/app/book:ro
    # بصمة في الظل: كل فحص يروح لخدمة basma بعد جواب Opus، ونسجّل هل اتفقوا (admin/basma). المستخدم ما يشوف شي منها.
    environment:
      - FISHID_BASMA_URL=http://basma:8090/basma

  basma:
    build:
      context: ..
      dockerfile: bench/bioclip/Dockerfile
    container_name: basma
    restart: unless-stopped
    entrypoint: ["python", "/app/serve.py"]
    # داخل شبكة Docker بس، بدون منفذ على السيرفر. النموذج محفوظ في data/hf (نفس اللي نزل وقت التجارب).
    volumes:
      - ../data/hf:/hf
    environment:
      - BASMA_THREADS=4
    # نصف المعالج بالكثير، عشان الخادم الأساسي يبقى سريع.
    cpus: 4
    mem_limit: 8g
