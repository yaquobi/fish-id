name: APK

# يبني ملف APK للتجربة مع كل تحديث على main، ويحفظه في صفحة التشغيل (Artifacts).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk fish-id.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fish-id-apk
          path: fish-id.apk
          retention-days: 30
