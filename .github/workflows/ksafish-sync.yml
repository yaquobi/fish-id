# يحدّث بيانات الأنواع في التطبيق من API موسوعة KSAFish ويرفع التغيير على نفس الفرع.
# يشتغل يدويًا، أو تلقائيًا إذا تغيّر سكربت التحديث نفسه.
name: KSAFish sync

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [tool/sync_ksafish.py, .github/workflows/ksafish-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync from ksafish.com
        run: python3 tool/sync_ksafish.py | tee sync.log
      - name: Commit
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/ksafish.json
          git commit -m "Sync species data from the KSAFish API" -m "$(head -c 60000 sync.log)"
          git push
