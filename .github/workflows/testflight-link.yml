# يفعّل الرابط العام لقروب TestFlight الخارجي ويطبعه في السجل.
# يستخدم نفس مفتاح App Store Connect حق ios.yml.
name: TestFlight public link

on:
  workflow_dispatch:
    inputs:
      group:
        description: Beta group name
        default: Beta testers

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Enable public link
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GROUP: ${{ inputs.group }}
          APP_ID: "6828146440"
        run: |
          pip install -q pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, jwt, requests
          tok = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()),
               "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              os.environ["ASC_KEY_P8"], algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          h = {"Authorization": f"Bearer {tok}", "Content-Type": "application/json"}
          api = "https://api.appstoreconnect.apple.com/v1"
          r = requests.get(f"{api}/apps/{os.environ['APP_ID']}/betaGroups?limit=50", headers=h)
          r.raise_for_status()
          groups = r.json()["data"]
          for g in groups:
              print("group:", g["attributes"]["name"], "internal" if g["attributes"].get("isInternalGroup") else "external")
          g = next(g for g in groups if g["attributes"]["name"] == os.environ["GROUP"])
          body = {"data": {"type": "betaGroups", "id": g["id"], "attributes": {
              "publicLinkEnabled": True, "publicLinkLimitEnabled": False}}}
          r = requests.patch(f"{api}/betaGroups/{g['id']}", headers=h, json=body)
          print(r.status_code, r.text[:500])
          r.raise_for_status()
          print("PUBLIC_LINK", r.json()["data"]["attributes"].get("publicLink"))
          PY
