name: iOS

# يبني نسخة الآيفون ويرفعها لـ App Store Connect (TestFlight) مع كل تحديث على main.
# التوقيع تلقائي بمفتاح App Store Connect API محفوظ في أسرار المستودع:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (محتوى ملف ‎.p8 كامل). المفتاح لازم يكون بصلاحية Admin.
on:
  push:
    branches: [main]
    paths: [lib/**, ios/**, assets/**, pubspec.yaml, pubspec.lock, .github/workflows/ios.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: KF2789BP68
    steps:
      - name: Check signing secrets
        id: keys
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::warning::App Store Connect API key secrets are missing, skipping the iOS upload."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == 'true'
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.keys.outputs.ok == 'true'
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        if: steps.keys.outputs.ok == 'true'
        with:
          flutter-version: 3.47.8
          channel: stable
      - name: Write API key
        if: steps.keys.outputs.ok == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
      - name: Build Flutter (no signing yet)
        if: steps.keys.outputs.ok == 'true'
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Free a development certificate slot
        if: steps.keys.outputs.ok == 'true'
        # كل تشغيل يسوي شهادة تطوير جديدة، وأبل تسمح بعدد محدود. نحذف شهادات التطوير اللي سواها البناء الآلي فقط.
        run: |
          pip3 install -q --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install -q pyjwt cryptography
          python3 - <<'PY'
          import json, os, time, urllib.request, jwt
          key = open(os.environ["RUNNER_TEMP"] + "/asc/AuthKey.p8").read()
          now = int(time.time())
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          def call(method, url):
              req = urllib.request.Request(url, method=method, headers={"Authorization": "Bearer " + tok})
              with urllib.request.urlopen(req) as r:
                  body = r.read()
                  return json.loads(body) if body else {}
          base = "https://api.appstoreconnect.apple.com/v1/certificates"
          certs = call("GET", base + "?filter[certificateType]=DEVELOPMENT,IOS_DEVELOPMENT&limit=200")["data"]
          for c in certs:
              a = c["attributes"]
              print("certificate", c["id"], a.get("certificateType"), repr(a.get("displayName")), a.get("expirationDate"))
              if a.get("displayName") == "Created via API":
                  call("DELETE", base + "/" + c["id"])
                  print("revoked CI development certificate", c["id"], a.get("expirationDate"))
          print(len(certs), "development certificates checked")
          PY
      - name: Archive (cloud signing)
        if: steps.keys.outputs.ok == 'true'
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic
      - name: Upload to App Store Connect
        if: steps.keys.outputs.ok == 'true'
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
